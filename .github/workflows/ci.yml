name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      # Build, so a change that type-checks but cannot bundle (a broken path
      # alias, an unsupported Vite plugin, a missing asset) fails here instead
      # of on the deploy. `pnpm check` alone cannot catch that class of failure,
      # and the production outage recorded in
      # docs/PUNTAKIT_SESSION_REPORT_2026-09-30.md §9 is exactly what a gap in
      # this gate looks like.
      - name: Build
        run: pnpm build
