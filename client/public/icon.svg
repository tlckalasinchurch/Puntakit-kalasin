<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2c31" />
      <stop offset="55%" stop-color="#072028" />
      <stop offset="100%" stop-color="#061a1f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ff0dd" />
      <stop offset="100%" stop-color="#2fc4bd" />
    </linearGradient>
  </defs>

  <!-- App background, matching --color-canvas so the installed tile does not
       flash a different colour against the dark shell. -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Two soft washes: the same aurora as the PIN sign-in surface. -->
  <circle cx="150" cy="120" r="150" fill="#2fc4bd" opacity="0.20" />
  <circle cx="392" cy="430" r="130" fill="#7ff0dd" opacity="0.10" />

  <!-- The cross -->
  <path d="M 232 90 L 280 90 A 8 8 0 0 1 288 98 L 288 180 L 370 180 A 8 8 0 0 1 378 188 L 378 236 A 8 8 0 0 1 370 244 L 288 244 L 288 414 A 8 8 0 0 1 280 422 L 232 422 A 8 8 0 0 1 224 414 L 224 244 L 142 244 A 8 8 0 0 1 134 236 L 134 188 A 8 8 0 0 1 142 180 L 224 180 L 224 98 A 8 8 0 0 1 232 90 Z" fill="#ffffff" />

  <!-- Brand leaf, teal rather than the retired gold. -->
  <path d="M 265 370 C 310 370 345 405 345 450 C 300 450 265 415 265 370 Z" fill="url(#accentGrad)" transform="rotate(-15 305 410)" />
</svg>