<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the layout reach under the notch; the shells then
      add back env(safe-area-inset-*). `maximum-scale`/`user-scalable` are
      deliberately absent — pinch-zoom must keep working (pinned by
      ux-audit-regressions.test.ts).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      theme-color is set (and kept in sync) by ThemeContext: light uses the
      page canvas, dark uses the dark canvas. Dark is the default theme, so the
      static value here matches dark and is corrected on first paint.
    -->
    <meta name="theme-color" content="#111827" />
    <!-- Pre-paint theme: applies the stored (default dark) theme class and theme-color before the first frame,
         so a dark user never sees the light canvas while the app bundle loads. ThemeContext keeps them in step after mount. -->
    <script>
      (function () {
        var d = document.documentElement, t = "dark";
        try { var s = localStorage.getItem("theme"); if (s === "light" || s === "dark") t = s; } catch (e) {}
        if (t === "dark") d.classList.add("dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#111827" : "#fffbf7");
      })();
    </script>
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent draws content under the iOS status bar; the shells
         compensate with env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Puntakit" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS ignores an SVG apple-touch-icon; it must be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Prompt is requested as a head <link>, not a CSS @import: the @import sat
      inside the bundled stylesheet, so the browser only discovered it after
      downloading and parsing the whole bundle — a serial, render-blocking
      round trip before any text could render.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap"
    />
    <title>Puntakit Kalasin - คริสตจักรชีวิตสุขสันต์กาฬสินธุ์</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      An Umami analytics tag was scaffolded here, pointing at a
      `VITE_ANALYTICS_ENDPOINT` variable with a `data-website-id` of
      `VITE_ANALYTICS_WEBSITE_ID`. Neither variable is defined anywhere in this
      repo, so Vite left the placeholders literally in the built HTML and warned
      on every build, and the tag was missing the required type="module"
      attribute. Removed rather than shipped broken — note the placeholders are
      written here without their percent delimiters on purpose, because Vite
      substitutes those patterns anywhere in this file, comments included.
      To re-enable: set both variables (see .env.example) and re-add the tag
      with type="module".
    -->
  </body>
</html>
